<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Libertadores</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0d3b1f;
    font-family:Arial, Helvetica, sans-serif;
}

.flashcard{
    width:350px;
    height:220px;
    perspective:1000px;
    cursor:pointer;
}

.card{
    width:100%;
    height:100%;
    position:relative;
    transition:transform .6s;
    transform-style:preserve-3d;
}

.flashcard.flip .card{
    transform:rotateY(180deg);
}

.face{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    box-sizing:border-box;
    backface-visibility:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}

.front{
    background:#006437;
    color:#fff;
    font-size:28px;
    font-weight:bold;
}

.back{
    background:#ffffff;
    color:#222;
    transform:rotateY(180deg);
    font-size:18px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="flashcard" onclick="this.classList.toggle('flip')">
    <div class="card">

        <div class="face front">
            ⚽ Palmeiras
        </div>

        <div class="face back">
            <strong>País:</strong> Brasil<br>
            <strong>Primeira participação:</strong> 1961<br>
            <strong>Títulos:</strong> 1999, 2020 e 2021<br>
            <strong>Curiosidade:</strong> Um dos maiores vencedores da Libertadores.
        </div>

    </div>
</div>

</body>
</html>
